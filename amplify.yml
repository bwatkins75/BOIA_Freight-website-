version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Static site - copy only public files into dist/"
        - mkdir -p dist
        - cp -a index.html 404.html favicon.ico site.webmanifest robots.txt sitemap.xml assets privacy dist/
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
