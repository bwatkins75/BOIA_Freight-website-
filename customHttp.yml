customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
  - pattern: 'assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: 'favicon.ico'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
